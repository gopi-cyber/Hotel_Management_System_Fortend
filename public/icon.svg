<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#06090e" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="50%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#aa7c11" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Square Icon Badge -->
  <rect width="512" height="512" rx="112" fill="url(#bg-grad)" stroke="#d4af37" stroke-width="8" stroke-opacity="0.3" />
  
  <!-- Subtle luxury geometric inner frame -->
  <rect x="36" y="36" width="440" height="440" rx="84" fill="none" stroke="url(#gold-grad)" stroke-width="2" stroke-opacity="0.4" stroke-dasharray="8 6" />
  
  <!-- 5-Star Crown -->
  <g transform="translate(196, 95)" fill="url(#gold-grad)">
    <polygon points="60,10 74,40 106,44 82,66 88,98 60,82 32,98 38,66 14,44 46,40" transform="scale(0.35) translate(-10, -20)" />
    <polygon points="60,10 74,40 106,44 82,66 88,98 60,82 32,98 38,66 14,44 46,40" transform="scale(0.45) translate(45, -30)" />
    <polygon points="60,10 74,40 106,44 82,66 88,98 60,82 32,98 38,66 14,44 46,40" transform="scale(0.55) translate(80, -45)" />
    <polygon points="60,10 74,40 106,44 82,66 88,98 60,82 32,98 38,66 14,44 46,40" transform="scale(0.45) translate(145, -30)" />
    <polygon points="60,10 74,40 106,44 82,66 88,98 60,82 32,98 38,66 14,44 46,40" transform="scale(0.35) translate(235, -20)" />
  </g>

  <!-- Crest Monogram "L" -->
  <path d="M 210 170 L 255 170 L 255 330 L 335 330 L 335 370 L 210 370 Z" fill="url(#gold-grad)" filter="url(#glow)" />
  
  <!-- Ribbon Text Banner -->
  <text x="256" y="425" text-anchor="middle" font-family="Georgia, serif" font-size="28" font-weight="bold" letter-spacing="8" fill="#d4af37">LUXESTAY</text>
  <text x="256" y="450" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="600" letter-spacing="4" fill="#94a3b8">HOTELS &amp; RESIDENCES</text>
</svg>
